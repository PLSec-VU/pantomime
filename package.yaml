name:                uc-plugin
version:             0.1.0.0
github:              "RobinWebbers/uc-plugin"
license:             BSD-3-Clause
author:              "Robin Webbers"
maintainer:          "example@example.com"
copyright:           "2024 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/RobinWebbers/uc-plugin#readme>

default-extensions:
- ConstraintKinds
- DeriveDataTypeable
- DeriveTraversable
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- MultiParamTypeClasses
- MultiWayIf
- NamedFieldPuns
- RankNTypes
- ScopedTypeVariables
- TemplateHaskell
- TupleSections
- TypeApplications

dependencies:
- base >= 4.7 && < 5
- ghc >= 9.6.4
- syb >= 0.7.2.4
- composition
- containers
- transformers
- template-haskell
- mtl
- microlens
- QuickCheck

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  uc-plugin-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -fplugin UC
    - -fexpose-all-unfoldings
    dependencies:
    - uc-plugin

tests:
  uc-plugin-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - uc-plugin
    - hspec
    - HUnit
    - ghc-paths
    - directory
    - silently
